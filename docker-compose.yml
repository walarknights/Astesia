name: astesia

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://astesia.cc}
    image: astesia-web:latest
    depends_on:
      backend:
        condition: service_healthy
      akshare:
        condition: service_healthy
    ports:
      - "${ASTESIA_HTTP_BIND:-127.0.0.1}:${ASTESIA_HTTP_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: astesia-backend:latest
    # .env 需要包含 DATABASE_URL、AUTH_TOKEN_SECRET、AI/SMTP 密钥等运行期配置。
    # 后端进入容器后，DATABASE_URL 不要继续写 127.0.0.1；需改为容器可访问的数据库地址。
    env_file:
      - .env
    environment:
      AI_SERVER_HOST: 0.0.0.0
      AI_SERVER_PORT: 8787
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8787"
    volumes:
      - backend_uploads:/app/server/uploads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  akshare:
    build:
      context: .
      dockerfile: docker/Dockerfile.akshare
    image: astesia-akshare:latest
    environment:
      AKSHARE_HOST: 0.0.0.0
      AKSHARE_PORT: 8765
      AKSHARE_NETWORK_TIMEOUT_SECONDS: ${AKSHARE_NETWORK_TIMEOUT_SECONDS:-12}
    expose:
      - "8765"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  backend_uploads:
