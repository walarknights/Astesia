<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">

<!-- ================= 背景层 ================= -->

<!-- 极简海军蓝圆形背景 -->

<circle cx="250" cy="250" r="250" fill="#66b3ff" />

  

<!-- ================= 外围罗盘与边界 (纯白) ================= -->

<!-- 极简几何刻度圈 -->

<circle cx="250" cy="250" r="235" fill="none" stroke="#FFFFFF" stroke-width="2" />

<circle cx="250" cy="250" r="225" fill="none" stroke="#FFFFFF" stroke-width="5" />

<circle cx="250" cy="250" r="212" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 9" />

  

<!-- 罗盘四大方位指针 (与边界线精确对齐) -->

<polygon points="250,5 260,25 250,45 240,25" fill="#FFFFFF" /> <!-- 北 -->

<polygon points="250,495 260,475 250,455 240,475" fill="#FFFFFF" /> <!-- 南 -->

<polygon points="5,250 25,240 45,250 25,260" fill="#FFFFFF" /> <!-- 西 -->

<polygon points="495,250 475,240 455,250 475,260" fill="#FFFFFF" /> <!-- 东 -->

  

<!-- ================= 天体仪：后方轨道 ================= -->

<!-- 被指针遮挡的后半部分轨道，直接使用白线绘制，被前方的主体自然覆盖 -->

<circle cx="250" cy="250" r="125" fill="none" stroke="#FFFFFF" stroke-width="3" />

<!-- 赤道上半圆 -->

<path d="M 125 250 A 125 35 0 0 1 375 250" fill="none" stroke="#FFFFFF" stroke-width="3" />

<!-- 倾斜星轨 -->

<ellipse cx="250" cy="250" rx="125" ry="35" transform="rotate(-45 250 250)" fill="none" stroke="#FFFFFF" stroke-width="2" />

<ellipse cx="250" cy="250" rx="125" ry="35" transform="rotate(45 250 250)" fill="none" stroke="#FFFFFF" stroke-width="2" />

  

<!-- ================= 核心指南针指针 (纯白) ================= -->

<!-- 指针主体 - 完美对称的双向刃形 -->

<polygon points="250,55 275,250 250,445 225,250" fill="#FFFFFF" />

<!-- 指针中脊 - 替换为细长菱形，中心宽度3.5(248.25~251.75)，两端收束为0，实现锐利的渐隐切割 -->

<polygon points="250,70 251.75,250 250,430 248.25,250" fill="#1A2B4C" />

  

<!-- ================= 天体仪：前方轨道 ================= -->

<!-- 赤道下半圆 (横跨指针下半部)

设计巧思：先用 11px 的蓝色描边切断白色指针，再叠加 3px 的白色线条，

完美实现平面的“2.5D 穿插/悬浮镂空”效果，无需任何透明度。 -->

<path d="M 125 250 A 125 35 0 0 0 375 250" fill="none" stroke="#66b3ff" stroke-width="11" />

<path d="M 125 250 A 125 35 0 0 0 375 250" fill="none" stroke="#FFFFFF" stroke-width="3" />

  

<!-- ================= 中心发光星体 (平面极简版) ================= -->

<!-- 蓝色底座：用来盖住繁杂的线条交界处 -->

<circle cx="250" cy="250" r="22" fill="#1A2B4C" />

<!-- 纯白四芒星：代表施术单元的闪耀 -->

<path d="M 250 215 Q 250 250 285 250 Q 250 250 250 285 Q 250 250 215 250 Q 250 250 250 215 Z" fill="#FFFFFF" />

<!-- 星芒中心极简点缀 -->

<circle cx="250" cy="250" r="3" fill="#1A2B4C" />

  

</svg>