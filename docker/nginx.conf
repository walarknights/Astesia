upstream astesia_backend {
  server backend:8787;
  keepalive 32;
}

upstream astesia_akshare {
  server akshare:8765;
  keepalive 16;
}

map $http_x_forwarded_proto $astesia_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/promo;
  index index.html;

  client_max_body_size 6m;
  gzip on;
  gzip_types
    application/javascript
    application/json
    image/svg+xml
    text/css
    text/plain;

  location = /admin {
    return 301 /admin/;
  }

  location ^~ /admin/ {
    alias /usr/share/nginx/admin/;
    try_files $uri $uri/ /admin/index.html;
  }

  location = /health {
    proxy_pass http://astesia_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $astesia_forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location ^~ /api/securities/ {
    proxy_pass http://astesia_akshare;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $astesia_forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 120;
    proxy_send_timeout 120;
  }

  location ^~ /api/ {
    proxy_pass http://astesia_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $astesia_forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    try_files $uri =404;
    add_header Cache-Control "public";
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|map)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
