<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7C3AED" />
    <title>Astesia 离线中</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          linear-gradient(180deg, #f5edff 0%, #fff7ed 46%, #ffffff 100%);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
      }

      .card {
        width: min(100%, 420px);
        border-radius: 28px;
        padding: 28px 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 20px 48px rgba(124, 58, 237, 0.12);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 6px 12px;
        background: #f3e8ff;
        color: #6d28d9;
        font-size: 12px;
        font-weight: 700;
      }

      h1 {
        margin: 16px 0 10px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #64748b;
        font-size: 15px;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        margin-top: 20px;
        border-radius: 999px;
        padding: 10px 16px;
        background: #7c3aed;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">离线模式</span>
      <h1>当前网络不可用</h1>
      <p>Astesia 已为你缓存最近访问过的页面与静态资源。请恢复网络后重试，或返回首页继续查看本地内容。</p>
      <a href="/">返回首页</a>
    </main>
  </body>
</html>
